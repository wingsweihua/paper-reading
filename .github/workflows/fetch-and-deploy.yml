name: Fetch papers and deploy site

on:
  push:
    branches: [main, master]
  schedule:
    # 每天 UTC 6:00 跑一次（约北京时间 14:00）
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch papers
        run: python scripts/fetch_all.py

      - name: Prepare site (web + data)
        run: |
          mkdir -p _site
          cp -r web/* _site/
          mkdir -p _site/data
          cp data/*.json _site/data/

      - name: Create config.js from secrets
        env:
          SHEET_APPEND_URL: ${{ secrets.SHEET_APPEND_URL }}
          MY_SHEET_LINK: ${{ secrets.MY_SHEET_LINK }}
        run: |
          if [ -n "$SHEET_APPEND_URL" ]; then
            python3 -c "
          import os
          u = os.environ.get('SHEET_APPEND_URL', '')
          m = os.environ.get('MY_SHEET_LINK', '#')
          c = 'window.PAPER_SHARING_CONFIG = {\n  SHEET_APPEND_URL: \"' + u + '\",\n  MY_SHEET_LINK: \"' + m + '\",\n};\n'
          open('_site/config.js', 'w').write(c)
          "
          else
            cp web/config.example.js _site/config.js
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
